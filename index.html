<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الاختبار التاني 💗</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  font-family: Tahoma, Arial, sans-serif;
  text-align: center;
  color: #713c59;
  background: linear-gradient(135deg, #fffaff, #ffd8e9);
}

.card {
  width: 100%;
  max-width: 430px;
  padding: 27px 20px;
  border-radius: 28px;
  background: white;
  box-shadow: 0 10px 35px #d981ae33;
  animation: appear .5s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

h1 { color: #e45d9d; }
p { line-height: 2; }

input {
  width: 100%;
  padding: 14px;
  border: 2px solid #f4b6d4;
  border-radius: 14px;
  text-align: center;
  font-size: 18px;
  margin: 12px 0;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 15px;
  background: #f6acd0;
  color: #65314d;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #f28cbd; }

.heart {
  position: fixed;
  bottom: -30px;
  pointer-events: none;
  animation: float 5s linear forwards;
  z-index: 5;
}

@keyframes float {
  to { transform: translateY(-110vh) rotate(30deg); opacity: 0; }
}

.small { font-size: 12px; color: #b17c98; }
</style>
</head>

<body>

<div class="card" id="app">
  <div style="font-size:48px">🎀💗🎀</div>
  <h1>A Surprise For Ibrahim</h1>
  <p>
    استنى يا إبراهيم! 👀❤️<br>
    المفاجأة دي معمولة مخصوص ليك.<br>
    بس الأول لازم تثبت إنك الشخص المقصود! 🔐
  </p>

  <input id="password" type="password"
         placeholder="اكتب التاريخ السري">

  <button onclick="checkPassword()">افتح مفاجأتك 💗</button>
  <p id="error" style="color:#d94c86"></p>
  <p class="small">A little surprise, made with love 🎁</p>
</div>

<script>
const app = document.getElementById("app");

function hearts() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = ["💗","💕","💖","🤍","🎀"][
    Math.floor(Math.random() * 5)
  ];
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (18 + Math.random() * 20) + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}

setInterval(hearts, 700);

function checkPassword() {
  const value = document.getElementById("password").value.trim()
    .replaceAll("/", "")
    .replaceAll("-", "")
    .replaceAll(".", "")
    .replaceAll(" ", "");

  if (value === "2272026") {
    showWelcome();
  } else {
    document.getElementById("error").textContent =
      "لأ يا إبراهيم 😂 جرّب تاني، ركّز في التاريخ! 💗";
  }
}

function showWelcome() {
  app.innerHTML = `
    <div style="font-size:50px">🥹💗🎁</div>
    <h1>عرفتها يا إبراهيم!</h1>
    <p>
      التاريخ ده مش مجرد أرقام بالنسبة لي،
      ده يوم بدأ فيه فصل جديد في حكايتنا. ❤️
    </p>
    <p>جاهز تدخل الاختبار التاني؟ 😂</p>
    <button onclick="showQuiz()">ابدأ الاختبار 🎀</button>
  `;
}

const questions = [
  {
    q: "مين صاحب المفاجأة دي؟ 😂",
    answers: ["لولو طبعًا 💗", "محقق المباحث 👮", "مش عارف 😭"],
    correct: 0,
    message: "أيوه يا سيدي، لولو بنفسها عملتلك المفاجأة! 😂❤️"
  },
  {
    q: "لما لولو تقولك مفيش حاجة، تعمل إيه؟ 👀",
    answers: ["أجري 😂", "أطمن عليها وأسألها ❤️", "أنام 😴"],
    correct: 1,
    message: "بالظبط! الاهتمام الحلو بيفرق جدًا. 🥹"
  },
  {
    q: "إيه المطلوب منك في الاختبار ده؟ 🎁",
    answers: ["أركز وأجاوب 😂", "أطلب مساعدة الجمهور", "أقفل الموقع 😭"],
    correct: 0,
    message: "عاش يا إبراهيم! قربنا نوصل للمفاجأة. 💗"
  },
  {
    q: "آخر سؤال: جاهز للمفاجأة؟ 🥹",
    answers: ["جاهز جدًا ❤️", "قلبي مش مطاوعني 😂", "فين النتيجة؟"],
    correct: 0,
    message: "خلاص، جه وقت المفاجأة الكبيرة! 🎀"
  }
];

let index = 0;
let score = 0;

function showQuiz() {
  index = 0;
  score = 0;
  renderQuestion();
}

function renderQuestion() {
  const q = questions[index];
  let html = `
    <p style="color:#e45d9d">السؤال ${index + 1} من ${questions.length}</p>
    <h2>${q.q}</h2>
  `;

  q.answers.forEach((answer, i) => {
    html += `<button onclick="answer(${i})">${answer}</button>`;
  });

  app.innerHTML = html;
}

function answer(i) {
  const q = questions[index];
  if (i === q.correct) score++;

  app.innerHTML = `
    <div style="font-size:42px">😂💗</div>
    <h2>${q.message}</h2>
    <button onclick="nextQuestion()">نكمل؟ 👀</button>
  `;
}

function nextQuestion() {
  index++;
  if (index < questions.length) renderQuestion();
  else showFinal();
}

function showFinal() {
  app.innerHTML = `
    <div style="font-size:55px">💗🎀💗</div>
    <h1>وصلت للنهاية يا إبراهيم!</h1>
    <p>نتيجتك: ${score} من ${questions.length} 😂</p>
    <p>
      حبيت أعملك حاجة مختلفة تضحكك وتبسطك،
      وتفضل ذكرى حلوة بينا. ❤️
    </p>
    <p>
      يوم 22/7/2026 هيكون دايمًا تاريخ مميز في حكايتنا،
      ويارب نفضل نضيف لحكايتنا ذكريات أحلى وأحلى. 🥹💗
    </p>
    <p style="font-size:21px;color:#e45d9d">
      From Lolo to Ibrahim ❤️
    </p>
    <button onclick="showMusic()">عندي ليك أغنية 🎵</button>
  `;
}

function showMusic() {
  app.innerHTML = `
    <div style="font-size:50px">🎶💗</div>
    <h1>كلمة لرامي صبري</h1>
    <p>
      الأغنية اللي اخترتيها يا لولو مستنياكي هنا ❤️
    </p>
    <p>اضغطي على الزر لفتح الأغنية والاستماع إليها.</p>
    <button onclick="window.open(
      'https://www.youtube.com/results?search_query=رامي+صبري+كلمة+الأغنية',
      '_blank'
    )">شغّل الأغنية 🎵</button>
    <p class="small">من لولو لإبراهيم بكل الحب 🎀</p>
  `;
}
</script>

</body>
</html>
