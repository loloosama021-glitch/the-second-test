<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة الرمز والسر 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-main: #ff85a2;
            --pink-light: #fbb1bd;
            --pink-soft: #ffe5ec;
            --white: #ffffff;
            --dark-pink: #9e2a2b;
            --text-color: #4a4a4a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--pink-soft) 0%, var(--white) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: var(--text-color);
        }

        /* القلوب الخفيفة في الخلفية */
        .bg-element {
            position: fixed;
            font-size: 20px;
            color: var(--pink-light);
            opacity: 0.3;
            animation: float 6s infinite ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(15deg); }
        }

        .container {
            width: 90%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 133, 162, 0.2);
            backdrop-filter: blur(8px);
            border: 2px solid var(--pink-light);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.5s ease;
        }

        .hidden {
            display: none !important;
        }

        h1, h2 {
            color: var(--pink-main);
            margin-bottom: 20px;
        }

        /* شاشة الباسورد */
        .login-box input {
            width: 80%;
            padding: 12px 20px;
            border: 2px solid var(--pink-light);
            border-radius: 20px;
            outline: none;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .login-box input:focus {
            border-color: var(--pink-main);
            box-shadow: 0 0 10px rgba(255, 133, 162, 0.4);
        }

        .btn {
            background: linear-gradient(45deg, var(--pink-main), var(--pink-light));
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 133, 162, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 133, 162, 0.6);
        }

        .error-msg {
            color: #d90429;
            font-size: 14px;
            margin-top: 10px;
            height: 20px;
        }

        /* الاختبار */
        .quiz-header {
            font-size: 14px;
            color: var(--pink-main);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #333;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            background: var(--white);
            border: 2px solid var(--pink-soft);
            padding: 12px;
            border-radius: 15px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-color);
        }

        .option-btn:hover {
            background: var(--pink-soft);
            border-color: var(--pink-light);
        }

        .option-btn.correct {
            background: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724 !important;
        }

        .option-btn.wrong {
            background: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #721c24 !important;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 25px;
            font-size: 16px;
        }

        /* مشغل الموسيقى Floating */
        .music-control {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: white;
            border: 2px solid var(--pink-light);
            border-radius: 50px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .music-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        /* نهاية الفيلم */
        .love-ending {
            line-height: 1.8;
            font-size: 18px;
            animation: fadeIn 2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10deg); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- عناصر زينة دائرية في الخلفية -->
    <div class="bg-element" style="top: 10%; left: 15%;">💖</div>
    <div class="bg-element" style="top: 70%; left: 80%;">✨</div>
    <div class="bg-element" style="top: 40%; left: 85%;">🌸</div>
    <div class="bg-element" style="top: 80%; left: 10%;">🔒</div>

    <!-- مشغل الموسيقى -->
    <div class="music-control">
        <button class="music-btn" id="musicToggle">🎵</button>
        <span style="font-size: 12px; color: var(--pink-main);">كلمة - رامي صبري</span>
    </div>

    <!-- ملف الصوت (حطي لينك الأغنية أو حطي الملف بنفس المجلد وسميه song.mp3) -->
    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        
        <!-- 1. شاشة الدخول والباسورد -->
        <div id="loginScreen" class="login-box">
            <h1>أهلاً بك في عالم السر ✨</h1>
            <p style="margin-bottom: 20px; color: #666;">علشان تقدر تدخل.. اكتب السر اللي بيننا 🔒</p>
            <input type="password" id="passwordInput" placeholder="أدخل الباسورد...">
            <br>
            <button class="btn" onclick="checkPassword()">دخول 🔑</button>
            <div id="loginError" class="error-msg"></div>
        </div>

        <!-- 2. شاشة الاختبار/اللعبة -->
        <div id="quizScreen" class="hidden">
            <div class="quiz-header" id="quizProgress">السؤال 1 من 10</div>
            <div class="question-text" id="questionText">نص السؤال هيظهر هنا...</div>
            <div class="options-grid" id="optionsContainer"></div>
            <div class="feedback" id="feedbackText"></div>
            <button id="nextBtn" class="btn hidden" style="margin-top: 20px;" onclick="nextQuestion()">السؤال التالي ➔</button>
        </div>

        <!-- 3. شاشة النهاية (فيلم الحب) -->
        <div id="endingScreen" class="hidden love-ending">
            <h1>مبروك.. كشفت كل الأسرار! 🎬💖</h1>
            <p>وصلت للنهاية وقدرت تعدي كل الألغاز والغوامض..</p>
            <p style="margin-top: 15px; color: var(--pink-main); font-weight: bold;">
                "كل كلمة.. وكل خطوة كانت علشان تقولك قد إيه أنت مميز بجد."
            </p>
            <div style="font-size: 40px; margin-top: 20px;">🌹✨</div>
        </div>

    </div>

    <script>
        // --- 1. إعدادات الباسورد والأغنية ---
        // غيري الباسورد من هنا للكلمة المطلوبة من الأغنية (مثلاً: كلمة)
        const CORRECT_PASSWORD = "2272026"; 

        const bgMusic = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                bgMusic.pause();
                musicToggle.innerText = '🔇';
            } else {
                bgMusic.play();
                musicToggle.innerText = '🎵';
            }
            isPlaying = !isPlaying;
        }
        musicToggle.addEventListener('click', toggleMusic);

        // --- 2. التحقق من الباسورد ---
        function checkPassword() {
            const input = document.getElementById('passwordInput').value.trim();
            const errorMsg = document.getElementById('loginError');

            if (input === CORRECT_PASSWORD) {
                // تشغيل الأغنية فور الدخول الناجح
                bgMusic.play().then(() => { isPlaying = true; }).catch(() => {});
                
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('quizScreen').classList.remove('hidden');
                loadQuestion();
            } else {
                errorMsg.innerText = "الباسورد غلط.. ركز في كلمة الأغنية! ❌";
            }
        }

        // --- 3. الأسئلة والتفاعل ---
        // عدلي الأسئلة والإجابات هنا بسهولة
        const questions = [
            {
                q: "السؤال الأول: إيه أول حاجة خطفت عينك هنا؟",
                options: ["الغموض اللي في الجو", "التصميم الوردي", "الأغنية", "صاحب الموقع 😉"],
                correct: 3,
                wrongMsg: "غلط! حاول تركز في التفاصيل أكتر 😜",
                correctMsg: "إجابة صح ومضبوطة جداً! ❤️"
            },
            {
                q: "السؤال الثاني: السر الحقيقي ورا اللعبة دي إيه؟",
                options: ["مجرد اختبار عادي", "تحدي صعب", "رسالة حب مخفية 💌", "ضيع وقت"],
                correct: 2,
                wrongMsg: "لأ مش ده السر، فكر تاني!",
                correctMsg: "صح! الإحساس هو الأساس ✨"
            },
            {
                q: "السؤال الثالث: لو الدنيا هديت وفضلنا ساكتين.. إيه يتقال؟",
                options: ["ولا كلمة", "كلمة واحدة بتغير كل حاجة", "سكوت تام", "نسمع الأغنية"],
                correct: 1,
                wrongMsg: "إجابة خاطئة.. حاول مرة تانية!",
                correctMsg: "بالظبط! كلمة واحدة كفاية 🎶"
            },
            {
                q: "السؤال الرابع: درجة صعوبة الغموض هنا كام؟",
                options: ["سهل جداً", "متوسط", "صعب ومحتاج تركيز 🧠", "مستحيل"],
                correct: 2,
                wrongMsg: "مش بالبساطة دي.. جرب خيار تاني!",
                correctMsg: "فعلاً التحدي محتاج ذكاء 💡"
            },
            {
                q: "السؤال الخامس: اللون البينك بيعبر عن إيه في اللعبة دي؟",
                options: ["الهدوء", "الرومانسية والرقة", "الخوف", "العصبية"],
                correct: 1,
                wrongMsg: "ركز في إحساس الألوان! 🌸",
                correctMsg: "صح جداً.. لمسة حب ناعمة ✨"
            },
            {
                q: "السؤال السادس: من أصل 10 أسرار.. أنت متوقع توصل للنهاية؟",
                options: ["أكيد طبعاً 😎", "ممكن أستسلم", "مش عارف", "الغموض كسبني"],
                correct: 0,
                wrongMsg: "خلي عندك ثقة أكتر! حاول تاني ❌",
                correctMsg: "عاش! الثقة دي هي المطلوب 🔥"
            },
            {
                q: "السؤال السابع: الفيلم الحقيقي بيظبط لما يكون فيه إيه؟",
                options: ["دراما بس", "أكشن بس", "خليط من الحب والغموض 🎬", "نهاية حزينة"],
                correct: 2,
                wrongMsg: "لأ، الفيلم الحلو محتاج المكس ده!",
                correctMsg: "عبقري! وهو ده اللي بنعمله هنا ❤️"
            },
            {
                q: "السؤال الثامن: أسرع طريق لقلب الغموض هو؟",
                options: ["التسرع", "الصبر والتفكير", "الهروب", "الاستسلام"],
                correct: 1,
                wrongMsg: "التسرع بيخسرك! فكر تاني 🤔",
                correctMsg: "صح! بالصبر نوصل للسر 🗝️"
            },
            {
                q: "السؤال التاسع: الأغنية شغالة مع أحداث اللعبة علشان تدي إيه؟",
                options: ["إزعاج", "جو سينمائي تحفة 🎧", "ملل", "ولا حاجة"],
                correct: 1,
                wrongMsg: "غلط.. اسمع الصوت كويس! 🎶",
                correctMsg: "بالظبط.. كأنك في مشهد من فيلم!"
            },
            {
                q: "السؤال العاشر والأخير: هل جاهز تشوف المفاجأة الأخيرة؟",
                options: ["جاهز جداً! 💖", "خايف", "مش متأكد", "عايز أعيد اللعبة"],
                correct: 0,
                wrongMsg: "لازم تكون جاهز.. يلا جرب تاني!",
                correctMsg: "أهلاً بك في المشهد الأخير! 🎬"
            }
        ];

        let currentQ = 0;

        function loadQuestion() {
            const qData = questions[currentQ];
            document.getElementById('quizProgress').innerText = `السؤال ${currentQ + 1} من ${questions.length}`;
            document.getElementById('questionText').innerText = qData.q;
            document.getElementById('feedbackText').innerText = '';
            document.getElementById('nextBtn').classList.add('hidden');

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => selectOption(btn, idx);
                container.appendChild(btn);
            });
        }

        function selectOption(selectedBtn, idx) {
            const qData = questions[currentQ];
            const allBtns = document.querySelectorAll('.option-btn');
            
            // تعطيل باقي الأزرار أثناء التفاعل
            allBtns.forEach(btn => btn.style.pointerEvents = 'none');

            if (idx === qData.correct) {
                selectedBtn.classList.add('correct');
                document.getElementById('feedbackText').style.color = '#155724';
                document.getElementById('feedbackText').innerText = qData.correctMsg;
                document.getElementById('nextBtn').classList.remove('hidden');
            } else {
                selectedBtn.classList.add('wrong');
                document.getElementById('feedbackText').style.color = '#721c24';
                document.getElementById('feedbackText').innerText = qData.wrongMsg;
                
                // السماح بالمحاولة مرة أخرى بعد ثانية
                setTimeout(() => {
                    selectedBtn.classList.remove('wrong');
                    allBtns.forEach(btn => btn.style.pointerEvents = 'auto');
                }, 1000);
            }
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < questions.length) {
                loadQuestion();
            } else {
                // الانتقال لشاشة النهاية
                document.getElementById('quizScreen').classList.add('hidden');
                document.getElementById('endingScreen').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
